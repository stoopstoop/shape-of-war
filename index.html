<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Shape of War</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: #000; overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      /* Plain DOM debug labels: they must survive a renderer failure (G0 device check). */
      .sow-label {
        position: fixed; margin: 0; z-index: 10;
        pointer-events: none; white-space: pre;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
        color: #19e6f0; opacity: 0.8;
      }
      #sow-viewport {
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        padding: 4px 6px;
      }
      #sow-build {
        bottom: env(safe-area-inset-bottom, 0px);
        right: env(safe-area-inset-right, 0px);
        padding: 4px 6px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="sow-viewport" class="sow-label">[sow] waiting for script</div>
    <div id="sow-build" class="sow-label">build unknown (script not running)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
