      <circle cx="754" cy="600" r="32" fill="#ffe75a" fill-opacity="0.45" stroke="#cfe9f2" stroke-width="2"/>
      <circle cx="754" cy="672" r="36" fill="none" stroke="#cfe9f2" stroke-width="2"/>
      <rect x="759.4" y="23.6" width="5.3" height="16.8" fill="#e6faff"/>
      <rect x="771.3" y="23.6" width="5.3" height="16.8" fill="#e6faff"/>
    </g>
    <text x="24" y="32" fill="#e6faff" font-size="28" font-weight="600">12,450</text>
    <text x="24" y="56" fill="#a6ff4d" font-size="18">x37</text>
    <text x="96" y="50" fill="#fb9460" font-size="12" font-weight="600">PIERCE</text>
    <text x="400" y="23" fill="#e6faff" font-size="14" text-anchor="middle">Survive 1:12</text>
    <text x="400" y="47" fill="#e6faff" fill-opacity="0.8" font-size="14" text-anchor="middle">L7  Par 6,500  #a1b2c3d4</text>
    <text x="720" y="24" fill="#e6faff" font-size="16" text-anchor="end">&#9650;&#9650;</text>
    <text x="720" y="46" fill="#e6faff" font-size="14" text-anchor="end">&#9679;&#9679;&#9679;&#9679;</text>
