<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 840" width="860" height="840" font-family="sans-serif">
  <title>Shape of War HUD, main screen (10:9)</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>
  <rect width="860" height="840" fill="#000"/>
  <text x="30" y="36" fill="#cfe9f2" font-size="20">Main screen (10:9): HUD, right column layout. Example values. Schematic.</text>
