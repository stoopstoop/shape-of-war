<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" width="1260" height="860" font-family="sans-serif">
  <title>Shape of War controls, main screen (10:9)</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1260" height="860" fill="#000"/>
  <text x="30" y="36" fill="#cfe9f2" font-size="20">Main screen (10:9): touch zones and buttons. Schematic, 1 unit = 1 CSS px, no safe area insets.</text>
  <g transform="translate(30,60)" filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="800" height="720" rx="18" fill="none" stroke="#cfe9f2" stroke-width="2.5"/>
    <rect x="0" y="0" width="24" height="720" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="776" y="0" width="24" height="720" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="0" y="0" width="800" height="60" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="708" y="60" width="92" height="660" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="24" y="84" width="660" height="612" rx="6" fill="none" stroke="#3d64ff" stroke-width="2"/>
    <line x1="400" y1="6" x2="400" y2="714" stroke="#ffd85a" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="200" y="706" fill="#ffd85a" font-size="15" text-anchor="middle">left half: move</text>
    <text x="555" y="706" fill="#ffd85a" font-size="15" text-anchor="middle">right half: aim and fire</text>
    <circle cx="200" cy="470" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="200" cy="470" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="275" cy="420" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
    <line x1="200" y1="470" x2="275" y2="420" stroke="#9fffb0" stroke-width="1.5"/>
    <circle cx="560" cy="470" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="560" cy="470" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="490" cy="400" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
    <line x1="560" y1="470" x2="490" y2="400" stroke="#9fffb0" stroke-width="1.5"/>
    <rect x="740" y="4" width="56" height="56" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <rect x="759.4" y="22" width="5.3" height="17" fill="#e6faff"/>
    <rect x="771.3" y="22" width="5.3" height="17" fill="#e6faff"/>
    <circle cx="754" cy="600" r="38" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="754" cy="600" r="32" fill="none" stroke="#ffe75a" stroke-width="2.5"/>
    <path d="M754 568 A32 32 0 0 1 782 616 L754 600 Z" fill="#ffe75a" fill-opacity="0.45" stroke="none"/>
    <circle cx="754" cy="672" r="44" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="754" cy="672" r="36" fill="none" stroke="#cfe9f2" stroke-width="2.5"/>
    <text x="754" y="679" fill="#cfe9f2" font-size="20" text-anchor="middle">3</text>
  </g>
  <!-- alternative arrangement: bottom band (scale 0.42) -->
  <text x="880" y="112" fill="#cfe9f2" font-size="16">Alternative: bottom band</text>
  <text x="880" y="132" fill="#cfe9f2" font-size="13">(used when it gives a larger arena)</text>
  <g transform="translate(880,150) scale(0.42)" filter="url(#rough)" stroke-linecap="round">
    <rect x="0" y="0" width="800" height="720" rx="18" fill="none" stroke="#cfe9f2" stroke-width="4"/>
    <rect x="0" y="0" width="800" height="60" fill="#5ac8ff" fill-opacity="0.08" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="10 10"/>
    <rect x="0" y="562" width="800" height="158" fill="#5ac8ff" fill-opacity="0.08" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="10 10"/>
    <rect x="80" y="76" width="640" height="470" rx="6" fill="none" stroke="#3d64ff" stroke-width="3"/>
    <rect x="740" y="4" width="56" height="56" fill="none" stroke="#ff9ad5" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="400" cy="600" r="32" fill="none" stroke="#ffe75a" stroke-width="4"/>
    <circle cx="400" cy="672" r="36" fill="none" stroke="#cfe9f2" stroke-width="4"/>
    <text x="354" y="596" fill="#ffe75a" font-size="30" text-anchor="end">SUPER: HOMING</text>
    <text x="354" y="630" fill="#ffe75a" font-size="24" text-anchor="end" fill-opacity="0.7">charges with geoms</text>
  </g>
  <line x1="42" y1="806" x2="42" y2="784" stroke="#ff5a5a" stroke-width="1.5"/>
  <line x1="784" y1="806" x2="784" y2="782" stroke="#ff9ad5" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(160,170)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">1</text></g>
    <g transform="translate(600,170)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">2</text></g>
    <g transform="translate(230,392)"><circle r="14" fill="#000" stroke="#9fffb0" stroke-width="2"/><text y="6" fill="#9fffb0">3</text></g>
    <g transform="translate(590,392)"><circle r="14" fill="#000" stroke="#9fffb0" stroke-width="2"/><text y="6" fill="#9fffb0">4</text></g>
    <g transform="translate(430,260)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">5</text></g>
    <g transform="translate(42,820)"><circle r="14" fill="#000" stroke="#ff5a5a" stroke-width="2"/><text y="6" fill="#ff5a5a">6</text></g>
    <g transform="translate(736,92)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">7</text></g>
    <g transform="translate(720,622)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">8</text></g>
    <g transform="translate(784,820)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">9</text></g>
    <g transform="translate(470,104)"><circle r="14" fill="#000" stroke="#5ac8ff" stroke-width="2"/><text y="6" fill="#5ac8ff">10</text></g>
    <g transform="translate(1196,452)"><circle r="14" fill="#000" stroke="#5ac8ff" stroke-width="2"/><text y="6" fill="#5ac8ff">11</text></g>
  </g>
  <text x="70" y="850" fill="#cfe9f2" font-size="14">Dashed pink outlines are the real hit areas. Dotted green circles show the 120 px stick reach; the game draws only the faint knob.</text>
</svg>
