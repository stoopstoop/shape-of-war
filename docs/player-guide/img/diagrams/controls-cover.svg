<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 590" width="1110" height="590" font-family="sans-serif">
  <title>Shape of War controls, cover screen (21:9)</title>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1110" height="590" fill="#000"/>
  <text x="30" y="36" fill="#cfe9f2" font-size="20">Cover screen (21:9): touch zones and buttons. Schematic, 1 unit = 1 CSS px, no safe area insets.</text>
  <g transform="translate(30,60)" filter="url(#rough)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="1050" height="450" rx="18" fill="none" stroke="#cfe9f2" stroke-width="2.5"/>
    <rect x="0" y="0" width="24" height="450" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="1026" y="0" width="24" height="450" fill="#ff5a5a" fill-opacity="0.18" stroke="none"/>
    <rect x="0" y="0" width="160" height="450" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="938" y="0" width="112" height="450" fill="#5ac8ff" fill-opacity="0.06" stroke="#5ac8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="190" y="30" width="718" height="390" rx="6" fill="none" stroke="#3d64ff" stroke-width="2"/>
    <line x1="525" y1="6" x2="525" y2="444" stroke="#ffd85a" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="300" y="440" fill="#ffd85a" font-size="15" text-anchor="middle">left half: move</text>
    <text x="745" y="440" fill="#ffd85a" font-size="15" text-anchor="middle">right half: aim and fire</text>
    <circle cx="300" cy="300" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="300" cy="300" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="370" cy="260" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
    <line x1="300" y1="300" x2="370" y2="260" stroke="#9fffb0" stroke-width="1.5"/>
    <circle cx="760" cy="290" r="120" fill="none" stroke="#9fffb0" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="760" cy="290" r="14.4" fill="none" stroke="#9fffb0" stroke-width="1.2"/>
    <circle cx="690" cy="230" r="21.6" fill="#e6faff" fill-opacity="0.3" stroke="none"/>
