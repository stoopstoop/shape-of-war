  <line x1="42" y1="526" x2="42" y2="500" stroke="#ff5a5a" stroke-width="1.5"/>
  <line x1="1024" y1="534" x2="1024" y2="508" stroke="#ff9ad5" stroke-width="1.5"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
