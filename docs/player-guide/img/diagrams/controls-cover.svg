    <rect x="1011" y="22" width="4.4" height="14" fill="#e6faff"/>
    <rect x="1021" y="22" width="4.4" height="14" fill="#e6faff"/>
    <circle cx="994" cy="330" r="38" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="994" cy="330" r="28" fill="none" stroke="#ffe75a" stroke-width="2.5"/>
    <path d="M994 302 A28 28 0 0 1 1019 343 L994 330 Z" fill="#ffe75a" fill-opacity="0.45" stroke="none"/>
    <circle cx="994" cy="402" r="44" fill="none" stroke="#ff9ad5" stroke-width="1.2" stroke-dasharray="3 4"/>
