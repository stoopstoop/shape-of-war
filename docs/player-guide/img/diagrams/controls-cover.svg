    <g transform="translate(958,366)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">8</text></g>
    <g transform="translate(1024,548)"><circle r="14" fill="#000" stroke="#ff9ad5" stroke-width="2"/><text y="6" fill="#ff9ad5">9</text></g>
    <g transform="translate(110,96)"><circle r="14" fill="#000" stroke="#5ac8ff" stroke-width="2"/><text y="6" fill="#5ac8ff">10</text></g>
  </g>
  <text x="70" y="578" fill="#cfe9f2" font-size="14">Dashed pink outlines are the real hit areas. Dotted green circles show the 120 px stick reach; the game draws only the faint knob.</text>
