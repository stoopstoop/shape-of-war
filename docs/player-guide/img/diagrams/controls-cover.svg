    <g transform="translate(850,150)"><circle r="14" fill="#000" stroke="#ffd85a" stroke-width="2"/><text y="6" fill="#ffd85a">2</text></g>
    <g transform="translate(330,222)"><circle r="14" fill="#000" stroke="#9fffb0" stroke-width="2"/><text y="6" fill="#9fffb0">3</text></g>
